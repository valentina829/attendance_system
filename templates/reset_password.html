{% extends "base.html" %}
{% import "_macros.html" as ui with context %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth">
    <div class="card">
        <h2>Choose a new password</h2>
        <p class="hint">For the account <strong>{{ email }}</strong>.</p>
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            {{ ui.csrf() }}
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" autofocus autocomplete="new-password">
            <p class="hint">At least 8 characters.</p>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">

            <button type="submit" class="btn btn-primary full-width">Change password</button>
        </form>
    </div>
</div>
{% endblock %}
